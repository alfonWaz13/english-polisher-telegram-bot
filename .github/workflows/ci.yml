name: Lambda CI

on:
  push:
    branches: [ "main" ]
    paths:
      - '**.py'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    - name: Install Dependencies
      run: |
        pip install black flake8 flake8-pyproject
    - name: Run Black and Flake8
      run: |
        make format-check

  deploy:
    runs-on: ubuntu-latest
    needs: [lint]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install uv

      - name: Create deployment package
        run: |
          make generate-zip

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Publish new Lambda version
        run: |
          DATE=$(date '+%Y-%m-%d_%H-%M-%S')
          VERSION=$(aws lambda publish-version \
            --function-name EnglishPolisherTelegramBot \
            --description "Created at $DATE" \
            --query 'Version' --output text)
          aws lambda create-alias \
            --function-name EnglishPolisherTelegramBot \
            --name "$DATE" \
            --function-version "$VERSION" \
            --description "Alias created at $DATE"

      - name: Update Lambda function
        run: |
          aws lambda update-function-code --function-name EnglishPolisherTelegramBot --zip-file fileb://deployment_package.zip